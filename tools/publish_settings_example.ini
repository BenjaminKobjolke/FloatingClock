[FTP]
host = HOST
port = 21
username = USER
password = PASS
remote_path = /path

[OldFileHandling]
; Policy: "delete" or "rename"
policy = rename
; Subfolder for backups (when policy = rename)
subfolder_base = versions
; Naming: "timestamp" (YYYYMMDD_HHMMSS) or "version" (uses --version arg)
subfolder_naming = version

[PreSigning]
enabled = true
network_path = \\PATH
network_path_signed = \\PATH\signed
expected_signer = SIGNER NAME
poll_interval = 10
timeout = 300

[ReleaseNotes]
; Local path to release notes folder containing version subfolders (e.g., 2.0.0_1/)
path = D:/PATH/TO/PROJECT/release_notes
; Remote FTP path where release notes should be uploaded
remote_path = /public/sites/PROJECT/assets/release_notes
